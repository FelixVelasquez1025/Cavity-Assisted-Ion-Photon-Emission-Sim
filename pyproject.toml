[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caipe-sim"
version = "0.1.0"
description = "Yb-171 ion-cavity dynamics with hyperfine couplings and Gaussian laser pulses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.5",
    "numpy>=2.3.1",
    "qutip>=5.2.0,<6",
    "scipy>=1.16",
    "sympy>=1.14.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
jax = ["diffrax>=0.7.0", "jax>=0.8.1", "qutip-jax>=0.1.1"]
notebooks = ["jupyter>=1.1.1"]
legacy-atomic = ["atomic-physics>=2.0.5"]

[project.scripts]
caipe-sim = "caipe_sim.app_main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/caipe_sim"]

[tool.pytest.ini_options]
testpaths = ["tests/portfolio"]
